<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDChat Original + FCM Upgrade</title>

    <!-- Material Icons & Firebase SDK -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
        
        header { background-color: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; font-size: 1.1rem; }
        
        .user-setup {
            background-color: #1e293b; padding: 10px 15px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #334155;
        }

        .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; word-break: break-word; }
        .received { background-color: #27272a; align-self: flex-start; }
        .sent { background-color: #2563eb; align-self: flex-end; }

        .controls { padding: 12px; background-color: #1f1f1f; display: flex; gap: 10px; border-top: 1px solid #333; }
        
        input[type="text"] {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background-color: #27272a; color: #fff; outline: none; font-size: 0.95rem;
        }

        button { padding: 10px 16px; border-radius: 8px; border: none; background-color: #2563eb; color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .call-btn { background-color: #16a34a; }

        .call-banner {
            display: none; background-color: #dc2626; color: white; padding: 14px; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <header>IDChat Original (FCM Upgrade)</header>
    
    <!-- Username Setup -->
    <div class="user-setup">
        <input type="text" id="usernameInput" placeholder="မိမိ Username ရိုက်ပါ...">
        <button onclick="registerUser()">Set Name</button>
    </div>

    <!-- Connect Target -->
    <div class="user-setup" style="background-color: #0f172a;">
        <input type="text" id="targetUserInput" placeholder="ခေါ်ဆိုလိုသူ၏ Username ထည့်ပါ...">
        <button onclick="connectToUser()">Connect</button>
    </div>

    <div id="callBanner" class="call-banner">
        📞 <span id="callerNameText"></span> ထံမှ ဖုန်းဝင်လာပါသည်...
        <div style="margin-top: 8px; display: flex; justify-content: center; gap: 15px;">
            <button style="background: #16a34a;" onclick="acceptIncomingCall()">လက်ခံမည်</button>
            <button style="background: #dc2626;" onclick="rejectIncomingCall()">ငြင်းပယ်မည်</button>
        </div>
    </div>

    <div class="chat-container" id="chatBox"></div>

    <div class="controls">
        <input type="text" id="msgInput" placeholder="စာရိုက်ပါ...">
        <button onclick="sendMessage()"><span class="material-icons-round">send</span></button>
        <button class="call-btn" onclick="startCall()"><span class="material-icons-round">call</span></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDVU7hCAM3A_qO_pWuzuwt_pfDxPSkdb4U",
            authDomain: "idchat-v2.firebaseapp.com",
            projectId: "idchat-v2",
            storageBucket: "idchat-v2.firebasestorage.app",
            messagingSenderId: "761626214228",
            appId: "1:761626214228:web:7d008485070727720e52c1"
        };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        let peer = null, conn = null, currentCall = null;

        // Auto Load Username
        window.onload = () => {
            const savedName = localStorage.getItem('orig_username');
            if(savedName) {
                document.getElementById('usernameInput').value = savedName;
                registerUser();
            }
        };

        function registerUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if (!name) return alert('Username ရိုက်ထည့်ပါ');

            localStorage.setItem('orig_username', name);
            peer = new Peer('orig-id-' + name);

            peer.on('open', () => {
                alert('Username @' + name + ' အဖြစ် အဆင်သင့်ဖြစ်ပါပြီ');
            });

            peer.on('connection', (c) => {
                conn = c;
                setupChat();
            });

            // Call Receive
            peer.on('call', (call) => {
                currentCall = call;
                triggerFlashAndVibrate();
                document.getElementById('callerNameText').innerText = call.peer.replace('orig-id-', '@');
                document.getElementById('callBanner').style.display = 'block';
            });
        }

        function connectToUser() {
            const target = document.getElementById('targetUserInput').value.trim();
            if (!target) return alert('Target Username ထည့်ပါ');

            conn = peer.connect('orig-id-' + target);
            setupChat();
        }

        function setupChat() {
            conn.on('data', (data) => {
                triggerFlashAndVibrate();
                addMessage(data, 'received');
            });
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg || !conn) return;

            conn.send(msg);
            addMessage(msg, 'sent');
            input.value = '';
        }

        function startCall() {
            const target = document.getElementById('targetUserInput').value.trim();
            if (!target) return alert('Target Username ထည့်ပါ');

            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                currentCall = peer.call('orig-id-' + target, stream);
                currentCall.on('stream', (remoteStream) => {
                    playAudio(remoteStream);
                });
            });
        }

        function acceptIncomingCall() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                currentCall.answer(stream);
                currentCall.on('stream', (remoteStream) => {
                    playAudio(remoteStream);
                });
                document.getElementById('callBanner').style.display = 'none';
            });
        }

        function rejectIncomingCall() {
            if(currentCall) currentCall.close();
            document.getElementById('callBanner').style.display = 'none';
        }

        function playAudio(stream) {
            let audio = document.getElementById('remoteAudio');
            if(!audio) {
                audio = document.createElement('audio');
                audio.id = 'remoteAudio';
                audio.autoplay = true;
                document.body.appendChild(audio);
            }
            audio.srcObject = stream;
        }

        function addMessage(text, type) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + type;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Flashlight & Vibration
        async function triggerFlashAndVibrate() {
            if ("vibrate" in navigator) navigator.vibrate([500, 250, 500, 250, 500]);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const track = stream.getVideoTracks()[0];
                await track.applyConstraints({ advanced: [{ torch: true }] });
                setTimeout(() => {
                    track.applyConstraints({ advanced: [{ torch: false }] });
                    stream.getTracks().forEach(t => t.stop());
                }, 1500);
            } catch (e) {}
        }
    </script>
</body>
    </html>
